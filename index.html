            navigator.serviceWorker.register('/Producao/sw.js')

                    // Verificar se há update disponível
                    reg.update();
                    reg.addEventListener('updatefound', () => {
                        const newSW = reg.installing;
                        newSW.addEventListener('statechange', () => {
                            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('[SW] Nova versão disponível — a recarregar...');
                                window.location.reload();
                            }
                        });
                    });
                })
                .catch(err => console.log('[SW] Erro:', err));
            // Forçar reload quando SW toma controlo
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                console.log('[SW] Novo SW ativo — a recarregar...');
                window.location.reload();
            });
        }

        // Converte uma data do Excel/Power Automate para string ISO 'YYYY-MM-DD'.
        // Aceita Excel serial (string/número), dd/mm/yyyy, ISO yyyy-mm-dd[Thh:mm...].
        // Usa UTC para evitar bugs de timezone com horário de verão.
        function parseDataConfig(val) {
            if (val === null || val === undefined || val === '') return null;
            const s = String(val).trim();
            if (!s) return null;
            if (/^\d+(\.\d+)?$/.test(s)) {
                const d = new Date((parseFloat(s) - 25569) * 86400 * 1000);
                if (isNaN(d.getTime())) return null;
                return d.getUTCFullYear() + '-' +
                       String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
                       String(d.getUTCDate()).padStart(2, '0');
            }
            const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (iso) return iso[1] + '-' + iso[2] + '-' + iso[3];
            const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
            const d = new Date(s);
            if (isNaN(d.getTime())) return null;
            return d.getUTCFullYear() + '-' +
                   String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
                   String(d.getUTCDate()).padStart(2, '0');
        }

        // Devolve true se o artigo deve aparecer nos dropdowns de NOVO registo.
        function artigoEstaAtivo(a, dataRef) {
            if (!a.substituidoPor) return true;
            if (!a.dataSubstituicao) return false;
            const ref = (typeof dataRef === 'string' && dataRef)
                ? dataRef
                : new Date().toISOString().slice(0, 10);
            return ref < a.dataSubstituicao;

        // ============================================================

        // ============================================================
        // Tipos cuja seleção de Nº Série é OPCIONAL (não associados a encomendas).

        const TIPOS_SEM_ENCOMENDA_OBRIG = ['Logistica', 'Maquinacao'];

        // Tipos com seleção MÚLTIPLA de Nº Série (transporte de várias caixas em simultâneo).
        const TIPOS_MULTI_NS = ['Transporte'];
        function ehMultiNumSerie(tipo) {
            return TIPOS_MULTI_NS.includes(tipo);
        }
        // Helpers para converter entre array de NS e string concatenada com "; ".
        function nsArray(s) {
            return (s || '').split(';').map(x => x.trim()).filter(Boolean);
        }
        function nsStr(arr) {
            return (arr || []).join('; ');

        // Estados finais (encomenda não está mais "em curso")
        const ESTADOS_ENCOMENDA_FINAIS = [

            'Embalada ANN MET', 'Fornecido ANN MET'
        ];

        function encomendaEmCurso(enc) {
            if ((enc.estado || '').toLowerCase() === 'terminada') return false;
            if (ESTADOS_ENCOMENDA_FINAIS.includes(enc.estadoFinal || '')) return false;
            return true;
        }

        // Devolve nº de dias entre hoje e dataISO (negativo se passado).
        function diasAte(dataISO) {
            if (!dataISO) return null;
            const d = new Date(dataISO);
            if (isNaN(d.getTime())) return null;
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            d.setHours(0, 0, 0, 0);
            return Math.round((d - hoje) / 86400000);
        }

        function normalizaArtigo(s) {
            return (s || '').toString().replace(/\s+/g, ' ').trim().toLowerCase();

        // Deteta operações de embalamento (palavra "Embalamento" na unidade ou no nome).
        function ehOperacaoEmbalamento(op) {
            if (!op) return false;
            const unidade = (op.unidade || '').toLowerCase();
            const nome = (op.op || op.operacao || '').toLowerCase();
            return unidade.includes('embalamento') || nome.includes('embalamento');

        // ============================================================
        // SESSÃO COM EXPIRAÇÃO (dispositivos partilhados)
        // ============================================================
        // Sessão expira ao mudar de dia OU após N minutos sem atividade OU
        // se a janela perdeu o foco por mais de M minutos (operador foi-se embora).
        const SESSAO_TIMEOUT_MIN = 30;
        const SESSAO_BLUR_MIN = 5;
        // Após gravar um registo, a sessão fica aberta apenas por este nº de minutos
        // para permitir gravar registos seguidos sem fricção.
        const SESSAO_CURTA_MINUTOS = 3;

        function getSessaoOperador() {
            const op = localStorage.getItem('operadorProd');
            if (!op) return null;
            const ts = parseInt(localStorage.getItem('operadorProdTimestamp') || '0');
            if (!ts) return null;

            // Verificação 1: mudou de dia? (manhã seguinte = sempre novo PIN)
            const dataLogin = new Date(ts).toISOString().split('T')[0];
            const hoje = new Date().toISOString().split('T')[0];
            if (dataLogin !== hoje) return null;

            // Verificação 2: timeout normal de inatividade.
            // Se há sessão curta ativa (modo "pós-registo"), usa o limite curto.
            const expiraCurta = parseInt(localStorage.getItem('sessaoCurtaExpira') || '0');
            const limiteMs = expiraCurta > 0
                ? expiraCurta - Date.now()
                : (SESSAO_TIMEOUT_MIN * 60 * 1000) - (Date.now() - ts);
            if (limiteMs <= 0) return null;

            // Verificação 3: janela perdeu foco há mais de M minutos?
            // Se sim, presume que outro operador pode estar a apanhar a app.
            const blurTs = parseInt(localStorage.getItem('sessaoBlurTimestamp') || '0');
            if (blurTs > 0) {
                const blurMs = Date.now() - blurTs;
                if (blurMs > SESSAO_BLUR_MIN * 60 * 1000) return null;
            }

            return op;
        }

        function guardarSessao(nome) {
            localStorage.setItem('operadorProd', nome);

        // Renova sessão para "modo curto" (3 min) — usado depois de gravar registo

            const [hf, mf] = f.split(':').map(Number);
            let m = (hf * 60 + mf) - (hi * 60 + mi);
            if (m < 0) m += 1440;
            return Math.floor(m / 60) + 'h ' + (m % 60) + 'min';
        };

            let m = (hf * 60 + mf) - (hi * 60 + mi);

                    const arr = Array.isArray(dados) ? dados : (dados.value || []);
                    const regs = arr
                        .map(r => ({
                            data: parseDataConfig(r.Data || r.data) || '',
                            colaborador: (r.Colaborador || r.colaborador || '').toString().trim()
                        }))
                        .filter(r => r.data && r.colaborador === nomeOperador);
                    setRegistosHistoricos(regs);
                    localStorage.setItem(cacheKey, JSON.stringify(regs));
                    localStorage.setItem(cacheTimeKey, Date.now().toString());
                    return regs;
                } catch (e) {
                    console.log('Erro a carregar registos históricos:', e.message);
                    return [];
                }
            };

            // Calcula dias com 0 registos (úteis, não feriados, não ausências) desde
            // o início do mês corrente até ontem (não inclui hoje).
            const calcularDiasFalta = (nomeOperador, regs, feriados, ausencias) => {
                const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
                const inicioMes = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
                const datasComRegisto = new Set(regs.map(r => r.data));

                // Conjunto de datas em que o operador esteve ausente (intervalo expandido)
                const datasAusente = new Set();
                ausencias
                    .filter(a => a.nome === nomeOperador)
                    .forEach(a => {
                        // Construir Date em hora local (sem 'T' para evitar parse UTC)
                        const ini = new Date(a.dataInicio + 'T00:00:00');
                        const fim = a.dataFim ? new Date(a.dataFim + 'T00:00:00') : new Date(a.dataInicio + 'T00:00:00');
                        for (let d = new Date(ini); d <= fim; d.setDate(d.getDate() + 1)) {
                            datasAusente.add(toLocalISO(d));
                        }
                    });

                const setFeriados = new Set(feriados);
                // Adiciona também os feriados nacionais hardcoded (caso falhem no Excel).
                // FERIADOS está em 'MM-DD' (sem ano), e o ano é sempre o atual.
                const anoAtual = hoje.getFullYear();
                FERIADOS.forEach(md => setFeriados.add(anoAtual + '-' + md));
                const falta = [];
                for (let d = new Date(inicioMes); d < hoje; d.setDate(d.getDate() + 1)) {
                    const ds = toLocalISO(d);
                    const dow = d.getDay(); // 0=domingo, 6=sábado
                    if (dow === 0 || dow === 6) continue;
                    if (setFeriados.has(ds)) continue;
                    if (datasAusente.has(ds)) continue;
                    if (datasComRegisto.has(ds)) continue;
                    falta.push({ data: ds, diaSemana: ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][dow] });
                }
                return falta;
            };

            // Ao login, carrega registos do operador e calcula dias em falta
            useEffect(() => {
                if (!loggedIn || !operador) return;
                // Só verifica uma vez por sessão (não a cada render)
                const ultimaVerif = sessionStorage.getItem('ultimaVerifFalta_' + operador);
                if (ultimaVerif) return;
                sessionStorage.setItem('ultimaVerifFalta_' + operador, '1');

                (async () => {
                    const regs = await carregarRegistosOperador(operador);
                    const falta = calcularDiasFalta(operador, regs, feriadosCfg, ausenciasCfg);
                    if (falta.length > 0) {
                        setDiasFalta(falta);
                        setShowAvisoDias(true);
                    }
                })();
            }, [loggedIn, operador, feriadosCfg, ausenciasCfg]);

            // Verificação periódica: logout automático quando a sessão expira (30min, mudou dia,
            // ou perdeu foco há mais de SESSAO_BLUR_MIN minutos).
            // Evita que outro colaborador encontre o tablet com a sessão de outro ainda ativa.
            useEffect(() => {
                if (!loggedIn) return;
                const checkSessao = () => {
                    if (!getSessaoOperador()) {
                        // Sessão expirou - força logout
                        setOperador('');
                        setLoggedIn(false);
                        setSelEmp(null);
                        setPinDigits(['', '', '', '']);
                    }
                };
                // Quando o utilizador perde o foco da janela, regista o timestamp.
                // Quando volta a ter foco, getSessaoOperador() vai validar se passou tempo demais.
                const onBlur = () => {
                    if (localStorage.getItem('operadorProd')) {
                        localStorage.setItem('sessaoBlurTimestamp', Date.now().toString());
                    }
                };
                const onFocus = () => {
                    checkSessao();
                    // Se ainda tem sessão válida ao voltar, limpa o blur timestamp
                    if (getSessaoOperador()) {
                        localStorage.removeItem('sessaoBlurTimestamp');
                    }
                };
                const id = setInterval(checkSessao, 60 * 1000); // verifica de minuto a minuto
                window.addEventListener('blur', onBlur);
                window.addEventListener('focus', onFocus);
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) onBlur(); else onFocus();
                });
                return () => {
                    clearInterval(id);
                    window.removeEventListener('blur', onBlur);
                    window.removeEventListener('focus', onFocus);
                };
            }, [loggedIn]);

            // Modo do registo (hoje / retroativo / bloqueado) — usado pelos filtros
            // de encomenda e pelo carregamento lazy de terminadas.
            const modoReg = useMemo(() => modoRegisto(registo.data), [registo.data]);

            // ============================================================
            // TERMINADAS (carregadas só quando o operador faz registo retroativo,
            // porque uma caixa terminada hoje pode ter sido produzida ontem)
            // ============================================================
            const [encomendasTerminadas, setEncomendasTerminadas] = useState(() => {
                try {
                    const c = localStorage.getItem('encomendasTerminadasCache');
                    return c ? JSON.parse(c) : [];
                } catch (e) { return []; }
            });
            const [carregandoTerm, setCarregandoTerm] = useState(false);

            const carregarTerminadas = async () => {
                setCarregandoTerm(true);
                try {
                    const resp = await fetch(CONFIG.URL_ENCOMENDAS_TERMINADAS, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({})
                    });
                    if (!resp.ok) throw new Error('Status ' + resp.status);
                    const dados = await resp.json();
                    const arr = Array.isArray(dados) ? dados : (dados.value || []);
                    const encs = arr.map(row => ({
                        caixa: (row.Caixa || row.caixa || '').toString().trim(),
                        tipologia: (row.Tipologia || row.tipologia || '').toString().trim(),
                        numSerie: (row['Nº série'] || row.NumSerie || row['Nº serie'] || row['NumSérie'] || '').toString().trim(),
                        estado: (row.Estado || row.estado || '').toString().trim().toLowerCase(),
                        subEstado: (row.SubEstado || row.subEstado || '').toString().trim().toLowerCase(),
                        estadoFinal: (row['Estado Final'] || row.EstadoFinal || '').toString().trim(),
                        dataEntregaPrevista: parseDataConfig(row['Data Entrega Prevista'] || row.DataEntregaPrevista) || '',
                        dataEntregaReal: parseDataConfig(row['Data Entrega Real'] || row.DataEntregaReal) || '',
                        dataEmbalamento: parseDataConfig(row['Data Embalamento'] || row.DataEmbalamento) || '',
                        terminada: true
                    })).filter(e => e.caixa && e.numSerie);
                    setEncomendasTerminadas(encs);
                    localStorage.setItem('encomendasTerminadasCache', JSON.stringify(encs));
                    localStorage.setItem('encomendasTerminadasCacheTime', Date.now().toString());
                    console.log('Terminadas carregadas:', encs.length);
                } catch (e) {
                    console.log('Erro a carregar terminadas:', e.message);
                }
                setCarregandoTerm(false);
            };

            // Quando entra em modo retroativo, garantir que terminadas estão carregadas (cache 30min).
            useEffect(() => {
                if (!loggedIn) return;
                if (modoReg !== 'retroativo') return;
                const t = parseInt(localStorage.getItem('encomendasTerminadasCacheTime') || '0');
                if (Date.now() - t > 30 * 60 * 1000) carregarTerminadas();
            }, [loggedIn, modoReg]);

            // Forçar recarga das configs
            const recarregarConfigs = () => {
                localStorage.removeItem('configCache');
                localStorage.removeItem('configCacheTime');
                setConfigLoaded(false);
                setConfigError('');
                window.location.reload();
            };

            // Persistência
            useEffect(() => { localStorage.setItem('registosProd', JSON.stringify(registos)); }, [registos]);
            useEffect(() => { localStorage.setItem('perturbacoesProd', JSON.stringify(perturbacoes)); }, [perturbacoes]);

            // Contagem de pendentes
            const pendentesCount = useMemo(() => {
                const r = registos.filter(x => !x.synced).length;
                const p = perturbacoes.filter(x => !x.synced).length;
                return r + p;
            }, [registos, perturbacoes]);

            // Reenvio automático ao fazer login e manual
            const reenviarPendentes = async (silencioso = false) => {
                const regPend = registos.filter(x => !x.synced);
                const pertPend = perturbacoes.filter(x => !x.synced);
                if (regPend.length === 0 && pertPend.length === 0) {
                    if (!silencioso) alert('✅ Não há registos por sincronizar!');
                    return;
                }
                setSincronizando(true);
                let sucesso = 0, falha = 0;
                // Reenviar operações
                const novosRegs = [...registos];
                for (const r of regPend) {
                    const ok = await enviarPowerAutomate(CONFIG.URL_PRODUCAO, {
                        ID: r.id.toString(), Data: r.data, Artigo: r.artigo,
                        TipoCaixa: r.tipoCaixa || '', Operacao: r.operacao,
                        UnidadeProducao: r.unidade, Colaborador: r.colaborador,
                        HoraInicio: r.horaInicio, HoraFim: r.horaFim,
                        Duracao: (r.duracao || 0).toString(), Comentarios: r.comentarios || '',
                        NumSerie: r.numSerie || '',
                        DataHoraRegisto: r.dataHora
                    });
                    const idx = novosRegs.findIndex(x => x.id === r.id);
                    if (ok) { novosRegs[idx] = { ...novosRegs[idx], synced: true }; sucesso++; }
                    else falha++;
                }
                setRegistos(novosRegs);
                // Reenviar perturbações
                const novasPerts = [...perturbacoes];
                for (const p of pertPend) {
                    const ok = await enviarPowerAutomate(CONFIG.URL_PERTURBACOES, {
                        IDRegisto: p.id.toString(), Data: p.data, Colaborador: p.colaborador,
                        TipoPerturbacao: p.tipo, HoraInicio: p.horaInicio,
                        HoraFim: p.horaFim, Duracao: p.duracao,
                        DataHoraRegisto: p.dataHora
                    });
                    const idx = novasPerts.findIndex(x => x.id === p.id);
                    if (ok) { novasPerts[idx] = { ...novasPerts[idx], synced: true }; sucesso++; }
                    else falha++;
                }
                setPerturbacoes(novasPerts);
                setSincronizando(false);
                setUltimaSync(new Date().toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }));
                if (!silencioso) {
                    if (falha === 0) alert('✅ ' + sucesso + ' registo(s) sincronizado(s) com sucesso!');
                    else alert('⚠️ ' + sucesso + ' sincronizado(s), ' + falha + ' falharam. Tenta novamente mais tarde.');
                }
            };

            // Reenvio automático ao fazer login
            useEffect(() => {
                if (loggedIn) reenviarPendentes(true);
            }, [loggedIn]);

            // Tipos/Programas dinâmicos - usa programas do Excel, com fallback
            const tiposDinamicos = useMemo(() => {
                const tiposComArtigos = [...new Set(artigosLista.map(a => a.tipo))];
                return tiposComArtigos.map(t => {
                    const prog = programasLista.find(x => x.id === t);
                    return prog || { id: t, nome: t, icon: '📦' };
                });
            }, [artigosLista, programasLista]);

            // Filtros
            const artigosFilt = useMemo(() => 
                registo.tipo
                    ? artigosLista
                        .filter(a => artigoEstaAtivo(a, registo.data))
                        .filter(a => a.tipo === registo.tipo)
                    : []
            , [registo.tipo, registo.data, artigosLista]);

            const opsFilt = useMemo(() => 
                registo.artigo ? operacoesLista.filter(o => o.artigos.includes(registo.artigo)) : []
            , [registo.artigo, operacoesLista]);

            // Helper: encomenda pode ser registada/transportada — alinhado com critério
            // da app de encomendas: estado é 'pendente' ou 'produzida' (ainda não saiu).
            const aindaNaoEntregue = (e) => e.estado === 'pendente' || e.estado === 'produzida';

            // Nºs de série de encomendas para o artigo+operação selecionados.
            // - Modo HOJE + EMBALAMENTO: estado === 'entregue' (já chegaram à secção).
            // - Modo HOJE + outras operações: estado === 'pendente' ou 'produzida', janela 10 dias.
            // - Modo RETROATIVO: todas as caixas do artigo (operador escolhe sob sua responsabilidade).
            // - Modo BLOQUEADO: lista vazia.
            const numerosSerieDisponiveis = useMemo(() => {
                if (!registo.artigo) return [];
                if (modoReg === 'bloqueado') return [];

                const opSel = operacoesLista.find(o => o.op === registo.operacao);
                const ehEmb = ehOperacaoEmbalamento(opSel);
                const artNorm = normalizaArtigo(registo.artigo);

                if (modoReg === 'retroativo') {
                    // Modo retroativo: caixas que já tinham trabalho em curso ou concluído.
                    // - As ativas (pendente/produzida/entregue/embalada) com subEstado solicitada
                    //   ou estado avançado podem aparecer.
                    // - As terminadas só aparecem se foram terminadas/embaladas/entregues
                    //   nos últimos N dias (caso contrário, a lista enche-se de histórico antigo).
                    const DIAS_TERMINADAS_RECENTES = 5;
                    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
                    const limite = new Date(hoje); limite.setDate(limite.getDate() - DIAS_TERMINADAS_RECENTES);

                    const dataMaisRecente = (e) => {
                        const candidatas = [e.dataEmbalamento, e.dataEntregaReal]
                            .filter(Boolean)
                            .map(d => new Date(d))
                            .filter(d => !isNaN(d.getTime()));
                        if (candidatas.length === 0) return null;
                        return new Date(Math.max(...candidatas.map(d => d.getTime())));
                    };

                    const todas = [...encomendas, ...encomendasTerminadas];
                    const vistas = new Set();
                    return todas
                        .filter(e => {
                            if (vistas.has(e.numSerie)) return false;
                            vistas.add(e.numSerie);
                            if (normalizaArtigo(e.caixa) !== artNorm) return false;

                            const jaSolicitada = e.subEstado === 'solicitada';
                            const jaAvancada = ['entregue', 'embalada', 'terminada'].includes(e.estado);
                            if (!jaSolicitada && !jaAvancada) return false;

                            // Se está terminada, só mostrar se foi nos últimos 5 dias
                            if (e.estado === 'terminada' || e.terminada) {
                                const ref = dataMaisRecente(e);
                                if (!ref) return false; // sem data = não conseguimos saber, excluir
                                return ref >= limite;
                            }
                            return true;
                        })
                        .map(e => ({ ...e, dias: diasAte(e.dataEntregaPrevista) }))
                        .sort((a, b) => (a.dias ?? 999) - (b.dias ?? 999));
                }

                const baseFiltrada = encomendas
                    .filter(e => normalizaArtigo(e.caixa) === artNorm);

                if (ehEmb) {
                    // Embalamento: caixas entregues à secção de embalamento, qualquer data
                    return baseFiltrada
                        .filter(e => e.estado === 'entregue')
                        .map(e => ({ ...e, dias: diasAte(e.dataEntregaPrevista) }))
                        .sort((a, b) => (a.dias ?? 999) - (b.dias ?? 999));
                }
                // Produção (soldadura, montagem, etc.): pendente/produzida com entrega
                // até 10 dias no futuro OU atrasadas até 5 dias (caixas com entrega no
                // passado que ainda não foram produzidas/entregues continuam a precisar
                // de trabalho, mas só dentro de uma janela razoável).
                return baseFiltrada
                    .filter(aindaNaoEntregue)
                    .map(e => ({ ...e, dias: diasAte(e.dataEntregaPrevista) }))
                    .filter(e => e.dias !== null && e.dias <= 10 && e.dias >= -5)
                    .sort((a, b) => a.dias - b.dias);
            }, [registo.artigo, registo.operacao, encomendas, encomendasTerminadas, operacoesLista, modoReg]);

            // PENDENTES PARA STOCK: 3 encomendas pendentes seguintes do artigo,
            // mostradas num 2º dropdown quando o colaborador escolhe "STOCK" — para
            // ele indicar a qual encomenda futura corresponde a produção antecipada.
            // Funciona em modo "hoje" e em modo "retroativo" (registos de dias anteriores).
            const pendentesParaStock = useMemo(() => {
                if (!registo.artigo) return [];
                if (modoReg === 'bloqueado') return [];

                const artNorm = normalizaArtigo(registo.artigo);
                // Encomendas pendentes do artigo que ainda NÃO estão "solicitadas"
                // (sem caixa específica em curso) — candidatas a receber a produção
                // antecipada para stock. Inclui as sem data de entrega prevista
                // (que são tipicamente as pendentes "puras" sem agendamento ainda).
                // Ordenação: com data ascendente primeiro, depois as sem data.
                return encomendas
                    .filter(e => normalizaArtigo(e.caixa) === artNorm)
                    .filter(aindaNaoEntregue)
                    .filter(e => e.subEstado !== 'solicitada')
                    .map(e => ({ ...e, dias: diasAte(e.dataEntregaPrevista) }))
                    .filter(e => e.dias === null || e.dias >= -5)
                    .sort((a, b) => {
                        if (a.dias === null && b.dias === null) return 0;
                        if (a.dias === null) return 1;  // sem data vai para o fim
                        if (b.dias === null) return -1;
                        return a.dias - b.dias;
                    })
                    .slice(0, 3);
            }, [registo.artigo, encomendas, modoReg]);

            // Lista de encomendas para Transporte (multi-select):
            // - Modo HOJE: subEstado='solicitada' + estado pendente/produzida + atrasadas/hoje.
            // - Modo RETROATIVO: todas as encomendas com subEstado='solicitada' (ativas + terminadas).
            // - Modo BLOQUEADO: vazio.
            const encomendasParaTransporte = useMemo(() => {
                if (!ehMultiNumSerie(registo.tipo)) return [];
                if (modoReg === 'bloqueado') return [];

                if (modoReg === 'retroativo') {
                    const todas = [...encomendas, ...encomendasTerminadas];
                    const vistas = new Set();
                    return todas
                        .filter(e => {
                            if (vistas.has(e.numSerie)) return false;
                            vistas.add(e.numSerie);
                            return e.subEstado === 'solicitada';
                        })
                        .map(e => ({ ...e, dias: diasAte(e.dataEntregaPrevista) }))
                        .filter(e => e.dias !== null && e.dias >= -5)
                        .sort((a, b) => (a.dias ?? 999) - (b.dias ?? 999));
                }
                return encomendas
                    .filter(e => e.subEstado === 'solicitada')
                    .filter(aindaNaoEntregue)
                    .map(e => ({ ...e, dias: diasAte(e.dataEntregaPrevista) }))
                    .filter(e => e.dias !== null && e.dias <= 0 && e.dias >= -5)
                    .sort((a, b) => a.dias - b.dias);
            }, [registo.tipo, encomendas, encomendasTerminadas, modoReg]);

            const regsDia = useMemo(() => 
                registos.filter(r => r.data === dataAtual && r.colaborador === operador)
            , [registos, dataAtual, operador]);

            const pertsDia = useMemo(() => 
                perturbacoes.filter(p => p.data === dataAtual && p.colaborador === operador)
            , [perturbacoes, dataAtual, operador]);

            // Totais
            const totais = useMemo(() => {
                let mp = 0, mpt = 0;
                regsDia.forEach(r => mp += calcMin(r.horaInicio, r.horaFim));
                pertsDia.forEach(p => mpt += calcMin(p.horaInicio, p.horaFim));
                return { ops: regsDia.length, perts: pertsDia.length, tempoProd: mp, tempoPert: mpt, total: mp + mpt };
            }, [regsDia, pertsDia]);

            // Resumo por tipo
            const resumoPorTipo = useMemo(() => {
                const r = {};
                regsDia.forEach(reg => {
                    const art = artigosLista.find(a => a.artigo === reg.artigo);
                    const t = art?.tipo || 'Outro';
                    if (!r[t]) r[t] = { ops: 0, min: 0 };
                    r[t].ops++;
                    r[t].min += calcMin(reg.horaInicio, reg.horaFim);
                });
                return r;
            }, [regsDia, artigosLista]);

            // Login/Logout com PIN
            const pickEmp = (emp) => {
                setSelEmp(emp);
                setPinDigits(['', '', '', '']);
                setPinError(false);
                setTimeout(() => {
                    const el = document.getElementById('pin0');
                    if (el) el.focus();
                }, 100);
            };

            const handlePinInput = (i, val, allDigits) => {
                if (!/^\d?$/.test(val)) return;
                const d = [...allDigits];
                d[i] = val;
                setPinDigits(d);
                if (val && i < 3) {
                    setTimeout(() => {
                        const el = document.getElementById('pin' + (i + 1));
                        if (el) el.focus();
                    }, 10);
                }
                if (val && i === 3) {
                    const fullPin = d.join('');
                    if (fullPin.length === 4) doLoginPin(selEmp, fullPin);
                }
            };

            const handlePinKeyDown = (i, e) => {
                if (e.key === 'Backspace' && !pinDigits[i] && i > 0) {
                    const el = document.getElementById('pin' + (i - 1));
                    if (el) el.focus();
                }
            };

            const doLoginPin = (emp, pin) => {
                if (!emp || pin.length !== 4) return;
                if (pins[emp.id] !== pin) {
                    setPinError(true);
                    setPinDigits(['', '', '', '']);
                    setTimeout(() => {
                        const el = document.getElementById('pin0');
                        if (el) el.focus();
                    }, 10);
                    return;
                }
                // Verificar registos em aberto de dias anteriores
                const hoje = new Date().toISOString().split('T')[0];
                const regsGuardados = JSON.parse(localStorage.getItem('registosProd') || '[]');
                const pertsGuardados = JSON.parse(localStorage.getItem('perturbacoesProd') || '[]');
                // Agrupar por dia, apenas dias anteriores a hoje
                const diasAnteriores = {};
                [...regsGuardados, ...pertsGuardados]
                    .filter(r => r.colaborador === emp.nm && r.data < hoje)
                    .forEach(r => {
                        if (!diasAnteriores[r.data]) diasAnteriores[r.data] = 0;
                        const [hi, mi] = (r.horaInicio||'0:0').split(':').map(Number);
                        const [hf, mf] = (r.horaFim||'0:0').split(':').map(Number);
                        let m = (hf*60+mf)-(hi*60+mi);
                        if (m < 0) m += 1440;
                        diasAnteriores[r.data] += m;
                    });
                // Verificar se há algum dia com menos de 450 min (7h30) — excluir fins de semana e dias encerrados
                const diasIncompletos = Object.entries(diasAnteriores)
                    .filter(([d, min]) => min < 450 && !eFimDeSemana(d) && localStorage.getItem('diaEncerrado_' + emp.nm + '_' + d) !== '1')
                    .sort((a, b) => b[0].localeCompare(a[0])); // mais recente primeiro
                localStorage.setItem('operadorProd', emp.nm);
                localStorage.setItem('operadorProdTimestamp', Date.now().toString());
                setOperador(emp.nm);
                setLoggedIn(true);
                setPinError(false);
                if (diasIncompletos.length > 0) {
                    const [dataInc, minInc] = diasIncompletos[0];
                    setAvisoRegistosAbertos({ data: dataInc, totalMin: minInc });
                }
            };

            const login = () => {
                const fullPin = pinDigits.join('');
                if (selEmp && fullPin.length === 4) doLoginPin(selEmp, fullPin);
            };

            const logout = () => {
                localStorage.removeItem('operadorProd');
                localStorage.removeItem('operadorProdTimestamp');
                setOperador('');
                setLoggedIn(false);
                setSelEmp(null);
                setPinDigits(['', '', '', '']);
                setPinError(false);
                setView('menu');
            };

            // Adicionar registo
            const addRegisto = async () => {
                if (!registo.artigo || !registo.operacao || !registo.horaInicio || !registo.horaFim) {
                    alert('Preencha todos os campos obrigatórios!');
                    return;
                }

                if (numSerieEhObrigatorio(registo.tipo) && !registo.numSerie) {
                    if (ehMultiNumSerie(registo.tipo)) {
                        alert('Tens de selecionar pelo menos uma caixa para transportar. Só aparecem caixas com estado "solicitada" para entrega hoje.');
                    } else if (registo.modoStock) {
                        alert('Escolheste STOCK mas ainda não atribuíste a uma encomenda pendente. Seleciona uma das encomendas pendentes para gravar.');
                    } else {
                        alert('Tens de selecionar o Nº Série da encomenda. Se não houver nenhum disponível para este artigo, confirma com o supervisor se escolheste o artigo certo.');
                    }
                    return;
                }

                // Validação de sobreposição de horários (no mesmo dia para o mesmo operador)
                const minutos = (h) => { const [hh, mm] = (h || '').split(':').map(Number); return (hh || 0) * 60 + (mm || 0); };
                const novoIni = minutos(registo.horaInicio);
                const novoFim = minutos(registo.horaFim);
                if (novoFim <= novoIni) {
                    alert('A hora de fim tem de ser depois da hora de início.');
                    return;
                }
                const registosDoDia = registos.filter(r => r.data === registo.data && r.colaborador === operador);
                const perturbacoesDoDia = perturbacoes.filter(p => p.data === registo.data && p.colaborador === operador);
                const todosDoDia = [
                    ...registosDoDia.map(r => ({ ...r, _tipo: 'operação', _label: (r.artigo || '') + ' / ' + (r.operacao || '') })),
                    ...perturbacoesDoDia.map(p => ({ ...p, _tipo: 'perturbação', _label: (p.tipo || 'perturbação') }))
                ];
                const conflito = todosDoDia.find(r => {
                    const ri = minutos(r.horaInicio);
                    const rf = minutos(r.horaFim);
                    return novoIni < rf && ri < novoFim; // sobreposição estrita
                });
                if (conflito) {
                    alert(
                        '⚠️ Sobreposição de horário!\n\n' +
                        'Já tens um registo nesta data:\n' +
                        '• ' + conflito.horaInicio + ' – ' + conflito.horaFim + '  (' + conflito._tipo + ')\n' +
                        '  ' + conflito._label + '\n\n' +
                        'O novo registo (' + registo.horaInicio + ' – ' + registo.horaFim + ') sobrepõe-se a esse. ' +
                        'Ajusta as horas e tenta de novo.'
                    );
                    return;
                }

                if (eFeriado(registo.data) && !confirm(formatData(registo.data) + ' é feriado. Continuar?')) return;

                const fimSem = eFimDeSemana(registo.data);
                if (fimSem && !confirm(formatData(registo.data) + ' é ' + fimSem + '. Trabalhaste neste dia? Continuar?')) return;

                renovarSessaoNormal(); // operador está ativo - mantem sessão de 4h enquanto preenche
                setLoading(true);
                const id = Date.now();
                const dur = calcDuracao(registo.horaInicio, registo.horaFim);
                const art = artigosLista.find(a => a.artigo === registo.artigo);

                const novo = {
                    id,
                    data: registo.data,
                    artigo: registo.artigo,
                    numSerie: registo.numSerie || '',
                    tipoCaixa: art?.tipo || '',
                    operacao: registo.operacao,
                    unidade: registo.unidade,
                    colaborador: operador,
                    horaInicio: registo.horaInicio,
                    horaFim: registo.horaFim,
                    duracao: dur,
                    comentarios: registo.comentarios,
                    dataHora: new Date().toLocaleString('pt-PT'),
                    synced: false
                };

                // Enviar para Power Automate
                const enviado = await enviarPowerAutomate(CONFIG.URL_PRODUCAO, {
                    ID: id.toString(),
                    Data: registo.data,
                    Artigo: registo.artigo,
                    TipoCaixa: art?.tipo || '',
                    Operacao: registo.operacao,
                    UnidadeProducao: registo.unidade,
                    Colaborador: operador,
                    HoraInicio: registo.horaInicio,
                    HoraFim: registo.horaFim,
                    Duracao: dur.toString(),
                    Comentarios: registo.comentarios || '',
                    NumSerie: registo.numSerie || '',
                    DataHoraRegisto: new Date().toLocaleString('pt-PT')
                });

                novo.synced = enviado;
                setRegistos([...registos, novo]);

                setRegisto({
                    ...registo,
                    artigo: '', numSerie: '', modoStock: false, operacao: '', unidade: '',
                    horaInicio: registo.horaFim, horaFim: '', comentarios: ''
                });

                setLoading(false);
                renovarSessaoCurta(); // após gravar, sessão fica em modo curto (3 min)
                setShowDiaModal(true);
            };

            // Adicionar perturbação
            const addPert = async () => {
                if (!pert.tipo || !pert.horaInicio || !pert.horaFim) {
                    alert('Preencha todos os campos!');
                    return;
                }

                // Validação de sobreposição (mesmo conjunto de regras que para registos)
                const minutos = (h) => { const [hh, mm] = (h || '').split(':').map(Number); return (hh || 0) * 60 + (mm || 0); };
                const novoIni = minutos(pert.horaInicio);
                const novoFim = minutos(pert.horaFim);
                if (novoFim <= novoIni) {
                    alert('A hora de fim tem de ser depois da hora de início.');
                    return;
                }
                const registosDoDia = registos.filter(r => r.data === pert.data && r.colaborador === operador);
                const perturbacoesDoDia = perturbacoes.filter(p => p.data === pert.data && p.colaborador === operador);
                const todosDoDia = [
                    ...registosDoDia.map(r => ({ ...r, _tipo: 'operação', _label: (r.artigo || '') + ' / ' + (r.operacao || '') })),
                    ...perturbacoesDoDia.map(p => ({ ...p, _tipo: 'perturbação', _label: (p.tipo || 'perturbação') }))
                ];
                const conflito = todosDoDia.find(r => {
                    const ri = minutos(r.horaInicio);
                    const rf = minutos(r.horaFim);
                    return novoIni < rf && ri < novoFim;
                });
                if (conflito) {
                    alert(
                        '⚠️ Sobreposição de horário!\n\n' +
                        'Já tens um registo nesta data:\n' +
                        '• ' + conflito.horaInicio + ' – ' + conflito.horaFim + '  (' + conflito._tipo + ')\n' +
                        '  ' + conflito._label + '\n\n' +
                        'A nova perturbação (' + pert.horaInicio + ' – ' + pert.horaFim + ') sobrepõe-se a esse. ' +
                        'Ajusta as horas e tenta de novo.'
                    );
                    return;
                }

                setLoading(true);
                const id = Date.now();
                const dur = calcDuracao(pert.horaInicio, pert.horaFim);

                const nova = {
                    id,
                    data: pert.data,
                    tipo: pert.tipo,
                    colaborador: operador,
                    horaInicio: pert.horaInicio,
                    horaFim: pert.horaFim,
                    duracao: dur,
                    dataHora: new Date().toLocaleString('pt-PT'),
                    synced: false
                };

                const enviado = await enviarPowerAutomate(CONFIG.URL_PERTURBACOES, {
                    IDRegisto: id.toString(),
                    Data: pert.data,
                    Colaborador: operador,
                    TipoPerturbacao: pert.tipo,
                    HoraInicio: pert.horaInicio,
                    HoraFim: pert.horaFim,
                    Duracao: dur,
                    DataHoraRegisto: new Date().toLocaleString('pt-PT')
                });

                nova.synced = enviado;
                setPerturbacoes([...perturbacoes, nova]);

                setPert({ ...pert, tipo: '', horaInicio: pert.horaFim, horaFim: '' });
                setLoading(false);
                renovarSessaoCurta(); // após gravar, sessão fica em modo curto (3 min)
                setShowDiaModal(true);
            };

            // ============================================================
            // MODAL - AVISO REGISTOS EM ABERTO
            // ============================================================
            const ModalAvisoAberto = () => {
                if (!avisoRegistosAbertos) return null;
                const { data, totalMin } = avisoRegistosAbertos;
                const [d, m, a] = data.split('-').reverse();
                const dataFmt = d + '/' + m + '/' + a;
                const h = Math.floor(totalMin / 60);
                const min = totalMin % 60;
                const hoje = new Date().toISOString().split('T')[0];
                const dataFmtHoje = hoje.split('-').reverse().join('/');
                return (
                    <div className="modal-overlay">
                        <div className="modal-box">
                            <div style={{ fontSize: '52px', marginBottom: '12px' }}>⚠️</div>
                            <h2 style={{ color: '#d97706' }}>Registos em aberto</h2>
                            <p>
                                No dia <strong>{dataFmt}</strong> ficaram registos por completar.<br/>
                                Total registado: <strong>{h}h {min}min</strong> (mín. 7h30)<br/><br/>
                                Tens de completar os registos antes de avançar.
                            </p>
                            <button className="modal-btn" style={{ background: 'linear-gradient(135deg, #d97706, #b45309)', color: 'white' }}
                                onClick={() => {
                                    setDataAtual(data);
                                    setAvisoRegistosAbertos(null);
                                }}>
                                📝 Completar registos de {dataFmt}
                            </button>
                        </div>
                    </div>
                );
            };

            // ============================================================
            // MODAL - DIAS DE REGISTO EM FALTA (mostrado ao login)
            // ============================================================
            const ModalAvisoDiasFalta = () => {
                if (!showAvisoDias || diasFalta.length === 0) return null;
                const irParaDia = (data) => {
                    setShowAvisoDias(false);
                    setRegisto({ ...registo, data, tipo: '', artigo: '', numSerie: '', modoStock: false, operacao: '', unidade: '', horaInicio: '', horaFim: '', comentarios: '' });
                    setView('operacao');
                };
                return (
                    <div className="modal-overlay">
                        <div className="modal-box" style={{ maxWidth: '460px' }}>
                            <div style={{ fontSize: '52px', marginBottom: '12px' }}>📅</div>
                            <h2 style={{ color: '#d97706' }}>
                                {diasFalta.length === 1 ? 'Dia por registar' : diasFalta.length + ' dias por registar'}
                            </h2>
                            <p style={{ marginBottom: '8px' }}>Olá <b>{operador}</b>, este mês há dias úteis sem registos teus:</p>
                            <div style={{ maxHeight: '240px', overflowY: 'auto', margin: '12px 0', padding: '8px', background: '#fef3c7', border: '1px solid #fcd34d', borderRadius: '8px' }}>
                                {diasFalta.map((d, i) => {
                                    const podeRegistar = diasAte(d.data) >= -DIAS_MAX_RETROATIVO;
                                    return (
                                        <div key={i} style={{
                                            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                                            padding: '8px 10px', marginBottom: '4px',
                                            background: 'white', borderRadius: '6px', fontSize: '14px'
                                        }}>
                                            <span style={{ fontWeight: 500 }}>
                                                {d.diaSemana} — {d.data.split('-').reverse().join('/')}
                                            </span>
                                            {podeRegistar ? (
                                                <button onClick={() => irParaDia(d.data)} style={{
                                                    background: '#1e40af', color: 'white', border: 'none',
                                                    padding: '6px 12px', borderRadius: '6px', fontSize: '12px',
                                                    fontWeight: 600, cursor: 'pointer'
                                                }}>
                                                    Registar
                                                </button>
                                            ) : (
                                                <span style={{ fontSize: '11px', color: '#991b1b' }}>
                                                    🔒 Fala c/ supervisor
                                                </span>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                            <p style={{ fontSize: '12px', color: '#64748b', margin: '0 0 12px 0' }}>
                                Os dias além de {DIAS_MAX_RETROATIVO} dias atrás não podem ser registados na app — pede ao supervisor para corrigir no admin.
                            </p>
                            <button className="modal-btn modal-btn-no" onClick={() => setShowAvisoDias(false)}>
                                Mais tarde
                            </button>
                        </div>
                    </div>
                );
            };

            // ============================================================
            // MODAL - DIA TERMINADO?
            // ============================================================
            const ModalDia = () => {
                const [fase, setFase] = useState(1);

                // Horas totais do dia (produção + perturbações registadas)
                const minutosTotais = totais.total;
                const horasTotais = minutosTotais / 60;
                const cumpriu8h = horasTotais >= 8;
                const txtHoras = Math.floor(minutosTotais / 60) + 'h ' + (minutosTotais % 60) + 'min';

                const encerrarDia = () => {
                    localStorage.setItem('diaEncerrado_' + operador + '_' + dataAtual, '1');
                    setShowDiaModal(false);
                    logout();
                };

                const saiMaisCedo = () => {
                    localStorage.setItem('diaEncerrado_' + operador + '_' + dataAtual, '1');
                    setShowDiaModal(false);
                    logout();
                };

                const continuarRegisto = () => {
                    renovarSessaoNormal();
                    setShowDiaModal(false);
                    setView('menu');
                };

                const terminarMaisTarde = () => {
                    setShowDiaModal(false);
                    logout();
                };

                return (
                    <div className="modal-overlay">
                        <div className="modal-box">
                            {fase === 1 ? (
                                cumpriu8h ? (
                                    // ────────────────────────────────────────────────
                                    // CASO A: já cumpriu 8h
                                    // ────────────────────────────────────────────────
                                    <>
                                        <div style={{ fontSize: '52px', marginBottom: '12px' }}>🏁</div>
                                        <h2>Já cumpriste o dia!</h2>
                                        <p style={{ marginBottom: '6px' }}>
                                            Tens <b>{txtHoras}</b> registadas hoje ({totais.ops} operações).
                                        </p>
                                        <p style={{ fontSize: '13px', color: '#64748b', marginBottom: '16px' }}>
                                            Dia terminado, ou ainda vais fazer horas extra?
                                        </p>
                                        <button className="modal-btn modal-btn-yes" onClick={encerrarDia}>
                                            ✅ Dia terminado
                                        </button>
                                        <button className="modal-btn modal-btn-no" onClick={continuarRegisto}>
                                            ➕ Vou fazer mais (horas extra)
                                        </button>
                                        <button className="modal-btn modal-btn-later" onClick={terminarMaisTarde}>
                                            🕐 Sair (registo mais depois)
                                        </button>
                                    </>
                                ) : (
                                    // ────────────────────────────────────────────────
                                    // CASO B: ainda não cumpriu 8h
                                    // ────────────────────────────────────────────────
                                    <>
                                        <div style={{ fontSize: '52px', marginBottom: '12px' }}>✅</div>
                                        <h2>Registo guardado!</h2>
                                        <p style={{ marginBottom: '6px' }}>
                                            Tens <b>{txtHoras}</b> registadas hoje ({totais.ops} operações).
                                        </p>
                                        <p style={{ fontSize: '13px', color: '#92400e', background: '#fef3c7', padding: '8px 12px', borderRadius: '8px', marginBottom: '16px' }}>
                                            ⏳ Faltam <b>{(8 - horasTotais).toFixed(1).replace('.', ',')}h</b> para completar o dia. Queres registar mais agora?
                                        </p>
                                        <button className="modal-btn modal-btn-no" onClick={continuarRegisto}>
                                            ➕ Sim, registar mais um
                                        </button>
                                        <button className="modal-btn modal-btn-later" onClick={terminarMaisTarde}>
                                            🕐 Não, registo mais tarde
                                        </button>
                                        <button className="modal-btn modal-btn-yes" style={{ background: 'linear-gradient(135deg, #f59e0b, #d97706)' }} onClick={() => setFase(2)}>
                                            ⚠️ Saí mais cedo (terminar dia)
                                        </button>
                                    </>
                                )
                            ) : (
                                // ────────────────────────────────────────────────
                                // FASE 2: confirmação de "saiu mais cedo" (com < 8h)
                                // ────────────────────────────────────────────────
                                <>
                                    <div style={{ fontSize: '52px', marginBottom: '12px' }}>🤔</div>
                                    <h2>Confirmar saída antecipada</h2>
                                    <p>
                                        Só tens <b>{txtHoras}</b> registadas. Confirmas que saíste mais cedo e queres terminar o dia?
                                    </p>
                                    <button className="modal-btn" style={{ background: 'linear-gradient(135deg, #f59e0b, #d97706)', color: 'white', marginBottom: '10px' }} onClick={saiMaisCedo}>
                                        ✅ Sim, saí mais cedo
                                    </button>
                                    <button className="modal-btn modal-btn-no" onClick={() => setFase(1)}>
                                        ← Voltar atrás
                                    </button>
                                </>
                            )}
                        </div>
                    </div>
                );
            };

            // ============================================================
            // ECRÃ LOGIN COM PIN
            // ============================================================
            if (!loggedIn) {
                const pinStyle = (i) => ({
                    width: '56px', height: '64px', textAlign: 'center', fontSize: '28px',
                    fontWeight: '700', border: '2px solid ' + (pinError ? '#dc2626' : '#e2e8f0'),
                    borderRadius: '12px', outline: 'none', background: pinError ? '#fef2f2' : '#f8fafc',
                    color: '#1e40af', transition: 'all .2s'
                });
                return (
                    <div style={{ minHeight: '100vh', background: 'linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
                        <div className="card" style={{ width: '100%', maxWidth: '420px', padding: '28px' }}>
                            <div className="text-center mb-4">
                                <div style={{ fontSize: '56px', marginBottom: '10px' }}>🏭</div>
                                <h1 style={{ fontSize: '22px', color: '#1e40af', margin: '0 0 4px 0' }}>Registo de Produção</h1>
                                <p style={{ color: '#64748b', margin: 0, fontSize: '14px' }}>Embaresa PT — Évora</p>
                            </div>

                            {/* Lista de colaboradores */}
                            <div style={{ marginBottom: '16px' }}>
                                <label className="label">👤 Selecionar colaborador</label>
                                <div style={{ maxHeight: '260px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '6px' }}>
                                    {colabsAtivos.map(emp => (
                                        <div key={emp.id}
                                            onClick={() => pickEmp(emp)}
                                            style={{
                                                padding: '12px 16px', border: '2px solid ' + (selEmp?.id === emp.id ? '#1e40af' : '#e2e8f0'),
                                                borderRadius: '10px', cursor: 'pointer', background: selEmp?.id === emp.id ? '#eff6ff' : '#f8fafc',
                                                display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                                                transition: 'all .15s', fontSize: '14px', fontWeight: selEmp?.id === emp.id ? '600' : '400'
                                            }}>
                                            <span>{emp.sh}</span>
                                            {selEmp?.id === emp.id && <span style={{ color: '#1e40af' }}>✓</span>}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Entrada de PIN */}
                            {selEmp && (
                                <div>
                                    <label className="label" style={{ textAlign: 'center', display: 'block', marginBottom: '12px' }}>
                                        🔑 PIN de {selEmp.sh.split(' ')[0]}
                                    </label>
                                    <div style={{ display: 'flex', gap: '10px', justifyContent: 'center', marginBottom: '12px' }}>
                                        {[0,1,2,3].map(i => (
                                            <input
                                                key={i}
                                                id={'pin' + i}
                                                type="tel"
                                                maxLength={1}
                                                value={pinDigits[i]}
                                                onChange={e => handlePinInput(i, e.target.value, pinDigits)}
                                                onKeyDown={e => handlePinKeyDown(i, e)}
                                                style={pinStyle(i)}
                                            />
                                        ))}
                                    </div>
                                    {pinError && (
                                        <div style={{ textAlign: 'center', color: '#dc2626', fontSize: '13px', marginBottom: '12px' }}>
                                            ❌ PIN incorreto. Tenta novamente.
                                        </div>
                                    )}
                                    <button className="btn btn-primary" style={{ width: '100%', padding: '14px', fontSize: '16px' }} onClick={login}>
                                        Entrar ➔
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // ============================================================
            // ECRÃ OPERAÇÃO
            // ============================================================
            if (view === 'operacao') {
                return (
                    <div style={{ minHeight: '100vh', background: '#f1f5f9' }}>
                        {avisoRegistosAbertos && <ModalAvisoAberto />}
                        {showDiaModal && <ModalDia />}
                    {showAvisoDias && <ModalAvisoDiasFalta />}
                        <div style={{ background: 'linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%)', color: 'white', padding: '20px', paddingTop: '40px' }}>
                            <button className="btn btn-secondary" style={{ marginBottom: '15px' }} onClick={() => setView('menu')}>← Voltar</button>
                            <h1 style={{ margin: 0, fontSize: '22px' }}>📦 Registar Operação</h1>
                            <div style={{ marginTop: '12px', padding: '10px 14px', background: 'rgba(255,255,255,0.18)', borderRadius: '8px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px' }}>
                                <div style={{ flex: 1, overflow: 'hidden' }}>
                                    <div style={{ fontSize: '11px', opacity: 0.85, marginBottom: '2px' }}>👤 SESSÃO ATIVA</div>
                                    <div style={{ fontSize: '17px', fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{operador}</div>
                                </div>
                                <button onClick={logout} style={{ background: '#dc2626', color: 'white', border: 'none', padding: '10px 16px', borderRadius: '8px', fontSize: '14px', fontWeight: 600, cursor: 'pointer', flexShrink: 0 }}>
                                    🚪 Não sou eu
                                </button>
                            </div>
                        </div>
                        <div style={{ padding: '20px' }}>
                            <div className="card">
                                <div className="mb-3">
                                    <label className="label">📅 Data</label>
                                    <input type="date" className="input" value={registo.data} onChange={e => setRegisto({ ...registo, data: e.target.value, numSerie: '', modoStock: false })} />
                                    {modoReg === 'retroativo' && (() => {
                                        const diasAtras = Math.abs(diasAte(registo.data));
                                        return (
                                            <div style={{ marginTop: '8px', padding: '10px 12px', background: '#fef3c7', border: '1px solid #fcd34d', borderRadius: '8px', fontSize: '13px', color: '#92400e' }}>
                                                ⏪ <b>Registo retroativo</b> — {diasAtras} {diasAtras === 1 ? 'dia' : 'dias'} atrás. Vais ver caixas solicitadas ou já avançadas (incluindo terminadas). Confirma bem o Nº Série antes de gravar.
                                                {carregandoTerm && (
                                                    <div style={{ marginTop: '4px', fontSize: '11px' }}>⌛ A carregar caixas terminadas...</div>
                                                )}
                                            </div>
                                        );
                                    })()}
                                    {modoReg === 'bloqueado' && (
                                        <div style={{ marginTop: '8px', padding: '10px 12px', background: '#fef2f2', border: '1px solid #fca5a5', borderRadius: '8px', fontSize: '13px', color: '#991b1b' }}>
                                            🔒 <b>Data não permitida</b> — só podes registar até {DIAS_MAX_RETROATIVO} dias atrás. Para registos mais antigos, fala com o supervisor.
                                        </div>
